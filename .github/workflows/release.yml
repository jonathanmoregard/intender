name: Build and Release Extension

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'wxt.config.ts'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    # Lifted out of the step that gates on it. The `secrets` context is not
    # available in a step's `if`, and using it there does not fail the step -
    # it makes the whole workflow file invalid, so the run completes with zero
    # jobs and no release. That is what silently killed every release between
    # v0.8.13 and v0.9.4. Gate on `env`, which is available.
    env:
      STORE_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      STORE_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and zip extension
        run: pnpm zip

      # v1 runs on a Node runtime GitHub no longer supports, so it would fail
      # the first time this workflow fires again. v2 takes the same inputs.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: .output/intender-${{ steps.version.outputs.version }}-chrome.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Release v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Says out loud which way the gate below went. A skipped step reads as a
      # pass in the Actions UI, and a store upload that quietly never happens
      # is the failure mode this workflow already has history with.
      - name: Report Chrome Web Store credential status
        run: |
          if [ -z "$STORE_EXTENSION_ID" ]; then
            echo "::warning::CHROME_EXTENSION_ID is not set, so the Chrome Web Store upload is being skipped. The GitHub release above still happened."
          elif [ -z "$STORE_PUBLISHER_ID" ]; then
            echo "::warning::CHROME_PUBLISHER_ID is not set, so the Chrome Web Store upload is being skipped. The V2 API addresses items as publishers/<publisher>/items/<item>, so the publisher ID is not optional. Find it in the Developer Dashboard. The GitHub release above still happened."
          else
            echo "Store credentials are set - uploading the zip to the Chrome Web Store as a draft."
          fi

      # Pinned to an exact tag because upstream publishes no moving major tag:
      # it has v5.0.0, v6.0.0 and v7.0.0, and no v5/v6/v7 to float on. The `@v5`
      # this used to say resolved to nothing at all, so the job would have died
      # fetching the action.
      #
      # v7.0.0 is the first release on the Chrome Web Store API V2. V1 was only
      # supported until 15 October 2026, which is why v6.0.0 is not an option
      # either - it still depends on chrome-webstore-upload v1.x, which talks to
      # www.googleapis.com/chromewebstore/v1.1.
      - name: Upload to Chrome Web Store
        if: env.STORE_EXTENSION_ID != '' && env.STORE_PUBLISHER_ID != ''
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: .output/intender-${{ steps.version.outputs.version }}-chrome.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          # Required from v7 on, and the reason a new secret appears here.
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # Upload only. Rolling the new version out to users stays a manual
          # click in the developer dashboard, because nothing here gates the
          # release on CI passing.
          publish: false
