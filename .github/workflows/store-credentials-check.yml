name: Check Chrome Web Store credentials

# Answers "could CD publish right now?" without publishing anything. Reads the
# listing back; uploads no zip, creates no release, changes nothing. Google
# expires a refresh token that has gone unused for six months, so a set of
# secrets that has sat untouched is not evidence of a working credential path.
#
# Prints no credential values. The access token derived from them is masked the
# moment it exists, because GitHub only masks the secrets it already knows.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    steps:
      - name: All four secrets are set
        run: |
          missing=0
          if [ -z "$EXTENSION_ID" ]; then echo "::error::CHROME_EXTENSION_ID is not set."; missing=1; else echo "CHROME_EXTENSION_ID is set."; fi
          if [ -z "$CLIENT_ID" ]; then echo "::error::CHROME_CLIENT_ID is not set."; missing=1; else echo "CHROME_CLIENT_ID is set."; fi
          if [ -z "$CLIENT_SECRET" ]; then echo "::error::CHROME_CLIENT_SECRET is not set."; missing=1; else echo "CHROME_CLIENT_SECRET is set."; fi
          if [ -z "$REFRESH_TOKEN" ]; then echo "::error::CHROME_REFRESH_TOKEN is not set."; missing=1; else echo "CHROME_REFRESH_TOKEN is set."; fi
          exit "$missing"

      - name: Google still accepts the refresh token
        run: |
          code=$(curl -sS -o /tmp/token.json -w '%{http_code}' \
            -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token)
          if [ "$code" != "200" ]; then
            echo "::error::Google refused the refresh token (HTTP $code). Mint a new CHROME_REFRESH_TOKEN."
            jq -r '"  error: \(.error // "unknown")\n  description: \(.error_description // "none given")"' /tmp/token.json || true
            rm -f /tmp/token.json
            exit 1
          fi
          token=$(jq -r '.access_token' /tmp/token.json)
          rm -f /tmp/token.json
          echo "::add-mask::$token"
          echo "ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Google accepted the refresh token and issued an access token."

      - name: The Web Store API serves this extension to this client
        run: |
          code=$(curl -sS -o /tmp/item.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID?projection=DRAFT")
          if [ "$code" != "200" ]; then
            echo "::error::The Web Store API rejected the read (HTTP $code). The token works, so suspect the extension ID, the API not being enabled on the Cloud project, or this account not being a publisher of this item."
            jq -r '"  message: \(.error.message // "none given")"' /tmp/item.json || true
            rm -f /tmp/item.json
            exit 1
          fi
          jq -r '"  upload state: \(.uploadState // "unknown")\n  crx version in the store: \(.crxVersion // "none")"' /tmp/item.json
          rm -f /tmp/item.json
          echo "All four credentials work. CD can upload."
